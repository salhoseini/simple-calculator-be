name: CI

on:
  push:
    brnaches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      uses: actions/setup-node@v4

      - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

      - name: Install dependencies
      run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test